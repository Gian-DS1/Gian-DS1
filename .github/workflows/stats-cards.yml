name: Update GitHub stats cards

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Stats card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=00000000&title_color=0369A1&text_color=10243A&icon_color=15803D
          path: profile/stats-light.svg
          fail_on_error: "true"

      - name: Stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=00000000&title_color=38BDF8&text_color=E6F2FF&icon_color=39FF14
          path: profile/stats-dark.svg
          fail_on_error: "true"

      - name: Top languages card (light)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=00000000&title_color=0369A1&text_color=10243A
          path: profile/langs-light.svg
          fail_on_error: "true"

      - name: Top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=00000000&title_color=38BDF8&text_color=E6F2FF
          path: profile/langs-dark.svg
          fail_on_error: "true"

      - name: Match CSS language markers to the profile palette
        run: sed -i 's/#663399/#00B3FF/g' profile/langs-*.svg

      - name: Commit cards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --staged --quiet; then
            echo "Cards unchanged, nothing to commit."
          else
            git commit -m "Update GitHub stats cards"
            git push
          fi
